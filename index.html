function conv(t){
  if(AR[t])return AR[t];
  for(const[r,f]of NT){const m=t.match(r);if(m)return f(m[1],m[2])}
  if(t.includes(' · ')){const p=t.split(' · '),q=p.map(conv);if(q.some((x,i)=>x!==p[i]))return q.join(' · ')}
  let m=t.match(/^View (\d+) repl(?:y|ies)$/);if(m)return'عرض '+m[1]+(m[1]==1?' رد':' ردود');
  m=t.match(/^(.+?)\s*\(([^)]*)\)$/);if(m&&AR[m[1]])return AR[m[1]]+' ('+m[2]+')';
  m=t.match(/^(.+?):\s*(.*)$/);if(m&&AR[m[1]])return AR[m[1]]+': '+(AR[m[2]]||m[2]);
  m=t.match(/^(\d+)\s+(.+)$/);if(m&&AR[m[2]])return m[1]+' '+AR[m[2]];
  m=t.match(/^(.+?)\s+(\d+)$/);if(m&&AR[m[1]])return AR[m[1]]+' '+m[2];
  return t}

let rec=null;
async function recToggle(){
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mt=['audio/webm','audio/mp4','audio/ogg'].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||'',chunks=[];
    rec=new MediaRecorder(st,mt?{mimeType:mt}:{});rec.ondataavailable=ev=>chunks.push(ev.data);
    rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());W.blob=new Blob(chunks,{type:rec.mimeType});W.file=null;W.link='';W.url=URL.createObjectURL(W.blob);$('#rc').classList.remove('rec');$('#rt').textContent=T('Recorded');$('#pv').src=W.url;$('#pv').hidden=false;$('#vk').value=''};
    rec.start();$('#rc').classList.add('rec');$('#rt').textContent=T('Tap to stop')}catch{toast('Microphone access was blocked')}}
async function submitForm(){
  const b=$('#nx'),v=W.v;b.disabled=true;
  const f={full_name:v.name.trim(),phone:v.phone.trim(),email:v.email.trim().toLowerCase(),nationality:v.nat.trim(),site:v.site,language:v.lang.trim(),age:+v.age,college:v.edu==='High school'?null:((v.college||'').trim()||null),edu_level:v.edu,military:v.mil,experience:(v.exp||'').trim()||null,offer:v.offer||null};
  if(W.id){const c=D.c.find(x=>x.id===W.id);if(await upd(c,f)){toast('Saved');history.back()}else b.disabled=false;return}
  const file=W.blob||W.file,vc=W.link?parseVocaroo(W.link):null;
  if(file&&file.size>MAXV){b.disabled=false;return toast('Voice file is too large (max 10 MB)')}
  if(file&&file.name&&!(file.type||'').startsWith('audio/')&&!VEXT.includes(file.name.split('.').pop().toLowerCase())){b.disabled=false;return toast('Unsupported voice file type')}
  b.textContent=T('Uploading…');let path=null,url=null;
  if(file){const ty=(file.type||'audio/webm').split(';')[0],ext=file.name?file.name.split('.').pop():ty.includes('mp4')?'m4a':ty.includes('ogg')?'ogg':'webm';
    path=`voice/${sess.user.id}/${Date.now()}.${ext.replace(/\W/g,'')}`;
    const u=await sb.storage.from(BUCKET).upload(path,file,{contentType:ty});if(u.error){b.disabled=false;b.textContent=T('Submit candidate');return toast(u.error.message)}
    url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
  const{data,error}=await sb.from('candidates').insert({...f,voice_path:path,voice_url:url,voice_link:file?null:vc.url}).select().single();
  if(error){if(path)sb.storage.from(BUCKET).remove([path]);b.disabled=false;b.textContent=T('Submit candidate');return toast(error.message)}
  D.c.unshift(data);toast('Saved');history.back()}

  b:()=>{$('#app').onclick=async ev=>{if(ev.target.closest('#oa')){const n=$('#on').value.trim();if(!n)return;const{data,error}=await sb.from('offers').insert({name:n}).select().single();if(error)return toast(error.message);D.o.push(data);show('');return}
    const t=ev.target.closest('[data-ot]');if(t){const o=D.o.find(x=>x.id==t.dataset.ot);const{error}=await sb.from('offers').update({active:!o.active}).eq('id',o.id);if(error)return toast(error.message);o.active=!o.active;show('');return}
    const d=ev.target.closest('[data-od]');if(d){if(!confirm('Delete this offer?'))return;const{error}=await sb.from('offers').delete().eq('id',d.dataset.od);if(error)return toast(error.message);D.o=D.o.filter(x=>x.id!=d.dataset.od);show('')}}}});
boot();
</script></body></html>
